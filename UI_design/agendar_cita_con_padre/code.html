<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-white dark:bg-slate-900 min-h-screen flex flex-col shadow-xl">
<!-- Header -->
<header class="flex items-center p-4 sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10 border-b border-slate-100 dark:border-slate-800">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined block">arrow_back</span>
</button>
<h1 class="text-xl font-bold ml-2 flex-1 text-slate-900 dark:text-slate-100">Agendar Nueva Cita</h1>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined block">help_outline</span>
</button>
</header>
<main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
<!-- Student Selection -->
<section class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Seleccionar Estudiante</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person_search</span>
<select class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100">
<option disabled="" selected="" value="">Buscar estudiante...</option>
<option value="1">Mateo García - Grado 11ºA</option>
<option value="2">Sofía Rodríguez - Grado 10ºB</option>
<option value="3">Lucas Martínez - Grado 9ºC</option>
<option value="4">Isabella López - Grado 11ºB</option>
</select>
</div>
</section><section class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Nombre del Padre o Tutor</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 text-sm" placeholder="Nombre completo del acudiente..." type="text"/>
</div>
</section>
<!-- Date Picker Calendar Style -->
<section class="space-y-3">
<div class="flex items-center justify-between px-1">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Fecha de la cita</label>
<span class="text-xs font-medium text-primary">Octubre 2023</span>
</div>
<div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
<div class="flex items-center justify-between mb-4">
<button class="size-8 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-sm">chevron_left</span>
</button>
<p class="text-sm font-bold">Octubre</p>
<button class="size-8 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-sm">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 gap-1 text-center">
<span class="text-[10px] font-bold text-slate-400 uppercase">D</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">L</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">M</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">M</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">J</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">V</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">S</span>
<!-- Empty slots for alignment -->
<div class="h-8"></div><div class="h-8"></div><div class="h-8"></div>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">1</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">2</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg bg-primary text-white font-bold">3</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">4</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">5</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">6</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">7</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">8</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">9</button>
<button class="h-8 w-full flex items-center justify-center text-sm rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">10</button>
</div>
</div>
</section>
<!-- Time Slots -->
<section class="space-y-3">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Hora de la cita</label>
<div class="grid grid-cols-3 gap-2">
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-primary text-slate-600 dark:text-slate-400 transition-all">08:00 AM</button>
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-primary bg-primary/10 text-primary transition-all">09:30 AM</button>
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-primary text-slate-600 dark:text-slate-400 transition-all">11:00 AM</button>
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-primary text-slate-600 dark:text-slate-400 transition-all">02:00 PM</button>
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-primary text-slate-600 dark:text-slate-400 transition-all">03:30 PM</button>
<button class="py-2.5 px-2 text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 opacity-50 cursor-not-allowed">05:00 PM</button>
</div>
</section>
<!-- Reason Selection -->
<section class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Motivo de la Cita</label>
<div class="flex flex-wrap gap-2">
<label class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:text-primary transition-all">
<input checked="" class="hidden" name="reason" type="radio"/>
<span class="text-sm font-medium">Vocacional</span>
</label>
<label class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:text-primary transition-all">
<input class="hidden" name="reason" type="radio"/>
<span class="text-sm font-medium">Académico</span>
</label>
<label class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:text-primary transition-all">
<input class="hidden" name="reason" type="radio"/>
<span class="text-sm font-medium">Personal</span>
</label>
<label class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:text-primary transition-all">
<input class="hidden" name="reason" type="radio"/>
<span class="text-sm font-medium">Seguimiento</span>
</label>
</div>
</section>
<!-- Additional Notes -->
<section class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Notas Adicionales</label>
<textarea class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 text-sm resize-none" placeholder="Escribe detalles importantes para la sesión..." rows="4"></textarea>
</section>
</main>
<!-- Footer Button -->
<footer class="p-4 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 sticky bottom-0">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">event_available</span>
                Confirmar Cita
            </button>
</footer>
<!-- Bottom Navigation Bar Overlay (Optional style based on component list) -->
<nav class="flex border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 pb-3 pt-2 safe-area-bottom">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">calendar_month</span>
<span class="text-[10px] font-medium">Citas</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">group</span>
<span class="text-[10px] font-medium">Estudiantes</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="text-[10px] font-medium">Perfil</span>
</a>
</nav>
</div>
</body></html>
