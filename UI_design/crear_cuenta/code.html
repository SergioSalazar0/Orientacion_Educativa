<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crear Cuenta - Orientación Educativa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden pb-10">
<!-- Top Navigation -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<a class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Crear Cuenta</h2>
</div>
<!-- Header Section -->
<div class="flex flex-col items-center px-4">
<div class="mt-6 mb-2 bg-primary/10 p-4 rounded-full">
<span class="material-symbols-outlined text-primary text-5xl">school</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-2 pt-2">Únete a Orientación Educativa</h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pb-6 pt-1 px-4 text-center max-w-[400px]">Comienza tu camino hacia una mejor guía académica y apoyo profesional.</p>
</div>
<!-- Registration Form -->
<div class="flex flex-col w-full max-w-[480px] mx-auto">
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium leading-normal pb-2">Nombre Completo</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 pl-12 pr-4 text-base font-normal leading-normal" placeholder="Ej. Juan Pérez" type="text" value=""/>
</div>
</label>
</div>
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium leading-normal pb-2">Correo Electrónico</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 pl-12 pr-4 text-base font-normal leading-normal" placeholder="ejemplo@correo.com" type="email" value=""/>
</div>
</label>
</div>
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium leading-normal pb-2">Contraseña</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 pl-12 pr-12 text-base font-normal leading-normal" placeholder="••••••••" type="password" value=""/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer">visibility</span>
</div>
</label>
</div>
<div class="px-4 py-6">
<button class="w-full h-14 bg-primary text-white font-bold text-lg rounded-xl hover:bg-primary/90 transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">how_to_reg</span>
                    Registrarse
                </button>
</div>
<div class="flex flex-col items-center gap-4 px-4 pb-10">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    ¿Ya tienes una cuenta? 
                    <a class="text-primary font-bold hover:underline" href="#">Inicia sesión</a>
</p>
<div class="w-full flex items-center gap-3">
<div class="h-px flex-1 bg-slate-300 dark:bg-slate-700"></div>
<span class="text-slate-400 text-xs font-medium uppercase tracking-wider">O continuar con</span>
<div class="h-px flex-1 bg-slate-300 dark:bg-slate-700"></div>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 h-12 flex items-center justify-center border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-5 h-5 mr-2" data-alt="Logotipo de Google para registro social" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0PWNPF8prgl_hTTdXcc73hypuXS4JY59vdGF8ZstMwBdBztSDOZaNqgezCBzuLo0ycmGIpjZ6-Z3poMYkP_3jumGiVObEO3Mpp53rvANNL9waodPP1frvdyg7NVDDp7fDI0mTg-cTVL3OgbOSXbUHS0I77p7L9EdwxvCQSghHOk5VqCl3zvdGIC_iLE0uuK9tWRSHihhN5Pyw-ud9Z9qt19Lic0xSOHQ5yYfxcoFXTGEaQKYCq4zO0h5VnHaAHo5IOaiaV1PP3kU"/>
<span class="text-sm font-medium">Google</span>
</button>
<button class="flex-1 h-12 flex items-center justify-center border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-black dark:text-white mr-2">ios</span>
<span class="text-sm font-medium">Apple</span>
</button>
</div>
</div>
</div>
<!-- Decorative elements -->
<div class="absolute bottom-0 right-0 -z-10 opacity-20 dark:opacity-10 pointer-events-none overflow-hidden">
<div class="bg-primary/30 w-64 h-64 rounded-full blur-3xl -mr-32 -mb-32"></div>
</div>
<div class="absolute top-20 left-0 -z-10 opacity-20 dark:opacity-10 pointer-events-none overflow-hidden">
<div class="bg-primary/20 w-48 h-48 rounded-full blur-3xl -ml-24"></div>
</div>
</div>
</body></html>
