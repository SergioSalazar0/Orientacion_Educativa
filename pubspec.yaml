name: orientacion_cbtis_app
description: "Sistema de gestión del Departamento de Orientación Educativa - CBTIS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Variables de entorno
  flutter_dotenv: ^5.1.0

  # Tipografía e iconos
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.1

  # Serialización JSON
  json_annotation: ^4.12.0

  # Importación de archivos
  file_picker: ^8.0.7
  excel: ^4.0.3
  csv: ^6.0.0

  # Imágenes
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI helpers
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Utilidades
  intl: ^0.19.0
  path: ^1.9.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - .env
